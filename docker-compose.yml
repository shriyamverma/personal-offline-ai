services:
  assistant-api:
    build:
      context: ./assistant-api
      target: runtime
    container_name: assistant-api
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    environment:
      DATABASE_PATH: /data/assistant.db
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      CHAT_MODEL: ${CHAT_MODEL:-openai/gpt-oss-20b}
      GROQ_CHAT_MODELS: ${GROQ_CHAT_MODELS:-openai/gpt-oss-20b,openai/gpt-oss-120b}
      QDRANT_URL: ${QDRANT_URL:-}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-shriyam_ai_memory_minilm_v1}
    volumes:
      - assistant_cloud_data:/data
  frontend:
    build:
      context: ./frontend
    container_name: assistant-frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - assistant-api
    restart: unless-stopped
volumes:
  assistant_cloud_data:
