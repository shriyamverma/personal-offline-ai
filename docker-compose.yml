services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
  ollama-init:
    image: alpine:3.20
    depends_on:
      - ollama
    volumes:
      - ./ollama/bootstrap.sh:/bootstrap.sh
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
  open-webui:
    profiles: [legacy-ui]
    image: ghcr.io/open-webui/open-webui:v0.9.6
    container_name: open-webui
    depends_on:
      - ollama
    ports:
      - "127.0.0.1:3003:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - open_webui_data:/app/backend/data
    restart: unless-stopped
  assistant-api:
    build:
      context: ./assistant-api
    container_name: assistant-api
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      ollama:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      - DATABASE_PATH=/data/assistant.db
    volumes:
      - assistant_data:/data
      - ./:/workspace
  frontend:
    build:
      context: ./frontend
    container_name: assistant-frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - assistant-api
    restart: unless-stopped
volumes:
  assistant_data:
  ollama_data:
  open_webui_data:
