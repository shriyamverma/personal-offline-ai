services:
  ollama:
    build:
      context: ./ollama
    container_name: ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  open-webui:
    build:
      context: ./open-webui
    container_name: open-webui
    depends_on:
      - ollama
    ports:
      - "127.0.0.1:3003:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - open_webui_data:/app/backend/data
    restart: unless-stopped

  assistant-api:
    build:
      context: ./assistant-api
    container_name: assistant-api
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data:
  open_webui_data: